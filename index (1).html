<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Своя игра: трудовые конфликты и правовое воспитание</title>
<style>
:root{--bg:#0b1f3a;--bg2:#143661;--gold:#e0b657;--tx:#f3efe4;--mut:#9fb2cf;--ok:#3fa56b;--bad:#c4563f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1f3a;--bg2:#143661;--gold:#e0b657;--tx:#f3efe4}}
:root[data-theme="dark"]{--bg:#0b1f3a;--bg2:#143661;--gold:#e0b657;--tx:#f3efe4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;min-height:100vh;padding:12px}
h1{margin:4px 0 2px;text-align:center;color:var(--gold);font-size:clamp(20px,4vw,40px)}
.sub{text-align:center;color:var(--mut);margin:0 0 12px;font-size:clamp(12px,1.8vw,18px)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:1100px;margin:0 auto}
.cat{background:var(--gold);color:var(--bg);font-weight:bold;text-align:center;padding:8px 4px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.7vw,19px);border-radius:6px;min-height:54px}
.cell{background:var(--bg2);color:var(--gold);border:2px solid var(--gold);border-radius:6px;font:bold clamp(18px,4vw,42px) Georgia,serif;padding:clamp(10px,2.6vw,28px) 0;cursor:pointer}
.cell:hover{background:var(--gold);color:var(--bg)}
.cell.used{visibility:hidden}
.teams{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:14px auto 0}
.team{background:var(--bg2);border:2px solid var(--mut);border-radius:8px;padding:8px 14px;text-align:center;min-width:140px}
.team input{background:none;border:0;border-bottom:2px dashed var(--gold);color:var(--tx);font:bold 18px Georgia,serif;text-align:center;width:100%;padding:4px 0;cursor:text}.team input:focus{outline:none;background:rgba(224,182,87,.15)}
.team b{display:block;font-size:clamp(24px,4vw,40px);color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(5,12,25,.94);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.on{display:flex}
.card{background:var(--bg2);border:3px solid var(--gold);border-radius:12px;max-width:820px;width:100%;padding:clamp(16px,3vw,36px);text-align:center}
.meta{color:var(--gold);font-size:clamp(13px,2vw,20px)}
.q{font-size:clamp(20px,3.6vw,36px);margin:16px 0;line-height:1.3}
.a{font-size:clamp(20px,3.4vw,34px);color:var(--gold);margin:12px 0;min-height:1.3em}
.tm{font-size:clamp(18px,3vw,30px);color:var(--mut)}
button.b{background:var(--gold);color:var(--bg);border:0;border-radius:8px;font:bold clamp(14px,2.2vw,22px) Georgia,serif;padding:10px 18px;margin:4px;cursor:pointer}
button.b.ok{background:var(--ok);color:#fff}
button.b.no{background:var(--bad);color:#fff}
.rl{text-align:left;font-size:clamp(14px,2.2vw,22px);line-height:1.4;margin:12px 0;padding-left:1.2em}.rl li{margin:6px 0}
</style>
</head>
<body>
<h1>Своя игра</h1>
<p class="sub">Трудовые конфликты и правовое воспитание учащихся</p>
<div style="text-align:center;margin-bottom:10px"><button class="b" onclick="rules()">Правила игры</button></div>
<div class="board" id="board"></div>
<div class="teams" id="teams"></div>
<p class="sub" style="margin-top:8px">✎ Чтобы переименовать команду, нажмите на её название и введите своё</p>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
const C=[
{n:"Забастовки в РК",q:[
["Какая статья Трудового кодекса РК закрепляет право работников на забастовку?","Статья 171"],
["За сколько рабочих дней работодателя нужно письменно предупредить о забастовке?","Не позднее чем за 5 рабочих дней"],
["Какая статья Трудового кодекса посвящена незаконным забастовкам?","Статья 176"],
["Что может сделать суд, признав забастовку незаконной?","Обязать немедленно её прекратить"]]},
{n:"История Казахстана",q:[
["В каком году бастовали шахтёры Карагандинского угольного бассейна?","В 1989 году (июль)"],
["Сколько тысяч человек ежедневно участвовали в карагандинской забастовке?","Примерно 10–15 тысяч"],
["Какое экологическое требование позже добавилось к требованиям шахтёров?","Закрытие Семипалатинского ядерного полигона"],
["Работники какой отрасли бастовали в 2011 году?","Железнодорожной"]]},
{n:"Мировая хроника",q:[
["В какой стране и в каком году до н. э. зафиксирована первая известная забастовка?","Древний Египет, 1159 г. до н. э."],
["Из-за чего прекратили работу строители гробниц при Рамсесе III?","Из-за невыдачи зерна"],
["В каком городе в 1769 году разрушали станки в протесте?","В Лондоне"],
["Как по Уложению 1845 года в Российской империи расценивалась забастовка?","Как уголовное преступление"]]},
{n:"Правовое воспитание",q:[
["В каком году принят Закон РК «О профилактике правонарушений»?","В 2010 году"],
["Какой возраст — главная целевая аудитория правового воспитания?","Подростки 14–17 лет"],
["Назовите один из трёх компонентов правовой грамотности.","Когнитивный, эмоционально-ценностный, поведенческий"],
["Как называется программа с направлением «Адал ұрпақ»?","«Біртұтас тәрбие»"]]},
{n:"Диалог вместо баррикад",q:[
["Как называется проект профсоюза в Мендыкаринском районе?","«Қорғау» (обучено 80 специалистов)"],
["Какой метод обучения праву — ролевая игра «Разработка законов выдуманного государства»?","Моделирование"],
["Кому принадлежат слова «Человек не воспитывается по частям, он создаётся синтетически»?","А. С. Макаренко"],
["Формула согласия: доступные правовые инструменты + ? = общество диалога.","Системное правовое воспитание молодёжи"]]}
];
const T=[{n:"Команда 1",s:0},{n:"Команда 2",s:0},{n:"Команда 3",s:0}];
const used={};let cur=null,tm=null,left=30;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function board(){
 let h=C.map(c=>`<div class="cat">${c.n}</div>`).join("");
 for(let r=0;r<4;r++)for(let c=0;c<5;c++){const k=c+"-"+r;
  h+=`<button class="cell ${used[k]?"used":""}" onclick="openQ(${c},${r})">${(r+1)*100}</button>`;}
 $("board").innerHTML=h;
}
function teams(){
 $("teams").innerHTML=T.map((t,i)=>`<div class="team"><input value="${esc(t.n)}" oninput="T[${i}].n=this.value" aria-label="Название команды"><b>${t.s}</b></div>`).join("");
}
function openQ(c,r){
 cur={c,r};left=30;
 const [q]=C[c].q[r];
 $("card").innerHTML=`<div class="meta">${C[c].n} · ${(r+1)*100}</div><div class="q">${q}</div><div class="tm" id="tm">30</div><div class="a" id="a"></div><div id="act"><button class="b" onclick="show()">Показать ответ</button></div>`;
 $("ov").classList.add("on");
 clearInterval(tm);
 tm=setInterval(()=>{left--;const e=$("tm");if(e)e.textContent=left>0?left:"Время!";if(left<=0)clearInterval(tm)},1000);
}
function show(){
 clearInterval(tm);
 $("a").textContent=C[cur.c].q[cur.r][1];
 $("act").innerHTML=T.map((t,i)=>`<button class="b ok" onclick="award(${i})">✓ ${esc(t.n)}</button>`).join("")+`<button class="b no" onclick="award(-1)">✗ Никто</button>`;
}
function award(i){
 if(i>=0)T[i].s+=(cur.r+1)*100;
 used[cur.c+"-"+cur.r]=1;cur=null;
 $("ov").classList.remove("on");
 board();teams();
 if(Object.keys(used).length===20)finish();
}
function finish(){
 const m=Math.max(...T.map(t=>t.s)),w=T.filter(t=>t.s===m).map(t=>esc(t.n)).join(" и ");
 $("card").innerHTML=`<div class="meta">Игра окончена</div><div class="q">Победа: ${w}<br>${m} очков</div><button class="b" onclick="reset()">Сыграть ещё раз</button>`;
 $("ov").classList.add("on");
}
function reset(){for(const k in used)delete used[k];T.forEach(t=>t.s=0);$("ov").classList.remove("on");board();teams();}
let ro=false;
function rules(){
 ro=true;
 $("card").innerHTML=`<div class="meta">Правила игры</div><ol class="rl"><li>Группа делится на 3 команды. Названия можно изменить внизу экрана.</li><li>Первая команда выбирает тему и стоимость вопроса (100–400). Дальше право выбора переходит по кругу.</li><li>Ведущий зачитывает вопрос. На ответ даётся 30 секунд, внутри команды можно советоваться.</li><li>Отвечает команда, выбравшая вопрос. Если ответ неверный или время вышло, право ответа переходит другой команде.</li><li>Верный ответ приносит команде очки, равные стоимости вопроса. Ведущий нажимает «Показать ответ», затем кнопку команды. Если не ответил никто, нажимается «✗ Никто», и вопрос сгорает.</li><li>Клавиша Esc закрывает вопрос без начисления очков, клетка остаётся на поле.</li><li>Всего 20 вопросов. Побеждает команда с наибольшим числом очков.</li></ol><button class="b" onclick="closeRules()">Начать игру</button>`;
 $("ov").classList.add("on");
}
function closeRules(){ro=false;$("ov").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(ro)closeRules();else if(cur){clearInterval(tm);cur=null;$("ov").classList.remove("on")}});
board();teams();rules();
</script>
</body>
</html>
